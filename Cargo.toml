[package]
name = "hexenzsene-chess"
version = "0.2.0"
edition = "2024"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "engine_bench"
harness = false

[profile.release-with-debug]
inherits = "release"
debug = true


[profile.release]
opt-level = 3
lto = true 
codegen-units = 1

[profile.bench]
inherits = "release"
opt-level = 3
lto = true
codegen-units = 1